name: ChatHaven CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install ESLint
        run: npm install eslint --save-dev

      - name: Run ESLint
        run: npx eslint --ext .js . || echo "Linting completed with warnings"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install test dependencies
        run: npm install jest @testing-library/jest-dom jsdom mongoose --save-dev

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage-unit/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install test dependencies
        run: npm install jest supertest mongodb-memory-server --save-dev

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: coverage-integration/

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install test dependencies
        run: npm install jest puppeteer jest-puppeteer --save-dev

      - name: Run acceptance tests
        run: npm run test:acceptance

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, acceptance-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create build package
        run: |
          echo "Creating production build..."
          mkdir -p build
          cp -r model build/
          cp -r public build/
          cp -r *.js build/
          echo '{"version": "1.0.0", "build": "'$GITHUB_RUN_NUMBER'", "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > build/build-info.json

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chathaven-build
          path: build/

      # Deploy steps would go here for your specific hosting environment
      # This is a placeholder comment as actual deployment varies by platform
